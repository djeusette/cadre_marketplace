name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ruby:
    name: cadre and the version-bump check
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: cadre
        run: ruby plugins/cadre/test/plugin_test.rb
      - name: The version-bump check's tests
        run: ruby test/check_version_bumps_test.rb

  engineering-review:
    name: engineering-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python3 -m unittest discover -s plugins/engineering-review/scripts -p 'test_*.py'
      - name: The plugin
        run: python3 plugins/engineering-review/scripts/check_plugin.py plugin plugins/engineering-review

  version-bumps:
    name: Each changed plugin bumps its version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check the versions
        env:
          BASE: origin/${{ github.base_ref }}
        run: ruby script/check_version_bumps.rb "$BASE"
