name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ruby:
    name: cadre's tests and the version-bump check's tests
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: cadre's tests
        run: ruby plugins/cadre/test/plugin_test.rb
      - name: The version-bump check's tests
        run: ruby test/check_version_bumps_test.rb

  engineering-review:
    name: engineering-review's tests and check_plugin.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: engineering-review's tests
        run: python3 -m unittest discover -s plugins/engineering-review/scripts -p 'test_*.py'
      - name: check_plugin.py on engineering-review
        run: python3 plugins/engineering-review/scripts/check_plugin.py plugin plugins/engineering-review

  break-check:
    name: The break-check runner's tests on Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.2", "3.4"]
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: The break-check runner's tests
        run: ruby plugins/engineering-review/scripts/test_break_check/all.rb

  old-ruby:
    name: The break-check runner refuses Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["2.6", "3.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Exit 2, naming the Ruby it needs
        run: |
          set +e
          output=$(ruby plugins/engineering-review/scripts/break_check.rb --help)
          code=$?
          echo "$output"
          test "$code" = 2 && test "$output" = "break_check.rb needs Ruby 3.2 or later; this is Ruby $(ruby -e "print RUBY_VERSION")"

  version-bumps:
    name: Each changed plugin bumps its version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check the versions
        env:
          BASE: origin/${{ github.base_ref }}
        run: ruby script/check_version_bumps.rb "$BASE"
